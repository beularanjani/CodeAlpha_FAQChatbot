<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ Chatbot</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb}
.chat{max-width:800px;margin:35px auto;background:white;border-radius:16px;box-shadow:0 8px 25px #0001;overflow:hidden}
.header{background:#3157d5;color:white;padding:22px;text-align:center}.header h1{margin:0}
.body{padding:20px}.messages{height:420px;overflow-y:auto;padding:10px;background:#f7f9ff;border-radius:12px}
.msg{padding:12px 15px;margin:10px 0;border-radius:12px;max-width:80%;line-height:1.45}
.bot{background:#e5ebff;margin-right:auto}.user{background:#3157d5;color:white;margin-left:auto}
.input{display:flex;gap:10px;margin-top:15px}.input input{flex:1;padding:13px;border:1px solid #ccd3e0;border-radius:9px;font-size:16px}
button{padding:13px 20px;border:0;border-radius:9px;background:#3157d5;color:white;font-weight:bold;cursor:pointer}
.examples{margin-top:15px;font-size:14px;color:#555}.examples span{display:inline-block;background:#eef2ff;padding:7px;margin:4px;border-radius:15px;cursor:pointer}
</style>
</head>
<body>
<div class="chat">
<div class="header"><h1>🤖 College FAQ Chatbot</h1><p>Ask a question about college services</p></div>
<div class="body">
<div id="messages" class="messages">
<div class="msg bot">Hello! 👋 Ask me a question about admissions, fees, placements, library, hostel, attendance, or exams.</div>
</div>
<div class="input">
<input id="question" placeholder="Type your question..." onkeydown="if(event.key==='Enter')askBot()">
<button onclick="askBot()">Send</button>
</div>
<div class="examples">
Try:
<span onclick="fill('How can I apply for admission?')">Admission</span>
<span onclick="fill('What are the library timings?')">Library</span>
<span onclick="fill('How can I check my attendance?')">Attendance</span>
<span onclick="fill('Tell me about placements')">Placements</span>
</div>
</div>
</div>

<script>
const faqs=[
{q:"How can I apply for admission?",a:"You can apply for admission through the college admission office or the official online admission portal. Keep your academic certificates and identification documents ready."},
{q:"What documents are needed for admission?",a:"Common documents include mark sheets, transfer certificate, community certificate if applicable, identification proof and passport-size photographs."},
{q:"What are the library timings?",a:"The library is generally open during college working hours. Please check your college notice board or library portal for the latest timing."},
{q:"How can I check my attendance?",a:"You can check attendance through the college student portal or contact your class advisor for the latest attendance details."},
{q:"What is the minimum attendance requirement?",a:"The required attendance percentage depends on your university and college regulations. Check your academic regulations or contact your department office."},
{q:"Tell me about placements.",a:"The placement cell conducts company drives, aptitude training, technical rounds and HR preparation. Students can check placement notices for current opportunities."},
{q:"How can I pay college fees?",a:"College fees can usually be paid through the student portal, online payment gateway, or the accounts office. Check the current fee notice for exact instructions."},
{q:"When are semester exams?",a:"Semester examination dates are published by the university and college. Check the official examination timetable for confirmed dates."},
{q:"How can I contact the department?",a:"You can contact your department office, class advisor or Head of Department during working hours."},
{q:"Is hostel accommodation available?",a:"Hostel availability depends on the institution and academic year. Contact the hostel office for application details, fees and availability."}
];

function tokenize(text){
    return text.toLowerCase()
      .replace(/[^a-z0-9\s]/g," ")
      .split(/\s+/)
      .filter(w=>w.length>2 && !["the","and","for","can","how","what","are","is","tell","me","about"].includes(w));
}

function similarity(a,b){
    const A=tokenize(a), B=tokenize(b);
    const set=[...new Set([...A,...B])];
    if(!set.length)return 0;
    let dot=0,na=0,nb=0;
    for(const word of set){
        const x=A.filter(w=>w===word).length;
        const y=B.filter(w=>w===word).length;
        dot+=x*y; na+=x*x; nb+=y*y;
    }
    return na&&nb ? dot/(Math.sqrt(na)*Math.sqrt(nb)) : 0;
}

function askBot(){
    const input=document.getElementById("question");
    const question=input.value.trim();
    if(!question)return;
    addMessage(question,"user");
    input.value="";

    let best=0,bestFaq=null;
    for(const faq of faqs){
        const score=similarity(question,faq.q);
        if(score>best){best=score;bestFaq=faq;}
    }

    let answer;
    if(bestFaq && best>=0.15){
        answer=bestFaq.a;
    }else{
        answer="Sorry, I couldn't find a close answer in my FAQ database. Please try asking about admissions, fees, library, attendance, placements, exams, department contact or hostel.";
    }
    setTimeout(()=>addMessage(answer,"bot"),250);
}

function addMessage(text,type){
    const box=document.getElementById("messages");
    const div=document.createElement("div");
    div.className="msg "+type;
    div.textContent=text;
    box.appendChild(div);
    box.scrollTop=box.scrollHeight;
}

function fill(text){
    document.getElementById("question").value=text;
    document.getElementById("question").focus();
}
</script>
</body>
</html>
